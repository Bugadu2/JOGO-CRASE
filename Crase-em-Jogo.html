<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17213b" />
  <meta name="description" content="Jogo educativo para praticar o uso da crase em português brasileiro." />
  <title>Crase em Jogo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect x=%225%22 y=%225%22 width=%2290%22 height=%2290%22 rx=%2220%22 fill=%22%23ffd45c%22 stroke=%22%2317213b%22 stroke-width=%227%22/%3E%3Ctext x=%2250%22 y=%2268%22 text-anchor=%22middle%22 font-size=%2260%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22%232d75d9%22%3Eà%3C/text%3E%3C/svg%3E%22 />
  <style>
    :root {
      --ink: #17213b;
      --ink-soft: #4b5876;
      --paper: #fffdf7;
      --cream: #f7f1e5;
      --blue: #2d75d9;
      --blue-dark: #1d4f9d;
      --yellow: #ffd45c;
      --coral: #ee765f;
      --mint: #56c7a6;
      --lilac: #a795e8;
      --line: #dbe2ef;
      --good: #168463;
      --bad: #bc4b44;
      --shadow: 0 20px 45px rgba(23, 33, 59, .14);
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--cream);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 212, 92, .34) 0 7%, transparent 22%),
        radial-gradient(circle at 92% 18%, rgba(167, 149, 232, .25) 0 8%, transparent 24%),
        linear-gradient(135deg, #f9f3e8 0%, #edf4ff 100%);
    }
    button { font: inherit; }
    .app-shell { min-height: 100vh; padding: 24px; position: relative; isolation: isolate; }
    .app-shell::before, .app-shell::after {
      content: ""; position: fixed; z-index: -1; pointer-events: none; border: 3px solid rgba(45,117,217,.13);
      transform: rotate(-12deg); border-radius: 24px;
    }
    .app-shell::before { width: 180px; height: 120px; left: -54px; bottom: 16%; }
    .app-shell::after { width: 130px; height: 90px; right: -35px; top: 42%; transform: rotate(18deg); }
    .topbar { max-width: 1120px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 900; letter-spacing: -.03em; font-size: 1.2rem; }
    .brand-mark { width: 43px; height: 43px; display: grid; place-items: center; background: var(--yellow); border: 3px solid var(--ink); border-radius: 13px 7px 13px 7px; box-shadow: 4px 4px 0 var(--ink); font-size: 1.45rem; transform: rotate(-4deg); }
    .top-hint { color: var(--ink-soft); font-size: .85rem; font-weight: 700; text-align: right; }
    .main-card { max-width: 1120px; margin: 0 auto; background: rgba(255,253,247,.9); border: 2px solid rgba(23,33,59,.12); border-radius: 32px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
    .screen { min-height: 610px; padding: clamp(24px, 5vw, 60px); animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .home-layout { display: grid; grid-template-columns: 1.15fr .85fr; gap: clamp(28px, 6vw, 80px); align-items: center; }
    .eyebrow { color: var(--blue-dark); font-weight: 900; text-transform: uppercase; letter-spacing: .16em; font-size: .76rem; margin: 0 0 16px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(3rem, 7vw, 6.5rem); line-height: .92; letter-spacing: -.075em; margin-bottom: 22px; max-width: 650px; }
    h1 span { color: var(--blue); display: block; }
    .lead { color: var(--ink-soft); max-width: 560px; font-size: clamp(1rem, 2vw, 1.22rem); line-height: 1.55; margin-bottom: 28px; }
    .cta-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .button { border: 0; cursor: pointer; border-radius: 15px; padding: 14px 20px; font-weight: 900; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .button:hover { transform: translateY(-3px); }
    .button:active { transform: translateY(1px) scale(.98); }
    ::selection { color: var(--paper); background: var(--blue); }
    .main-card { transition: box-shadow .3s ease, transform .3s ease; }
    .main-card:hover { box-shadow: 0 24px 55px rgba(23, 33, 59, .18); }
    .rule-chip { transition: transform .18s ease, background .18s ease; }
    .rule-chip:hover { transform: translateY(-2px) rotate(-2deg); background: #dfeaff; }
    .answer:active:not(:disabled) { transform: scale(.97); }
    .screen { position: relative; }
    .screen::after { content: ""; position: absolute; width: 9px; height: 9px; right: 28px; bottom: 25px; border-radius: 50%; background: var(--yellow); box-shadow: -18px 8px 0 var(--coral), -5px 24px 0 var(--mint); opacity: .75; }
    .button:focus-visible, .answer:focus-visible { outline: 4px solid rgba(45,117,217,.28); outline-offset: 3px; }
    .button.primary { color: var(--paper); background: var(--ink); box-shadow: 4px 4px 0 var(--blue); }
    .button.primary:hover { box-shadow: 6px 6px 0 var(--blue); }
    .button.secondary { color: var(--ink); background: #fff; border: 2px solid var(--line); }
    .button.secondary:hover { border-color: var(--blue); }
    .mini-note { color: var(--ink-soft); font-size: .88rem; font-weight: 700; }
    .mission-card { position: relative; background: var(--blue); color: white; padding: 28px; border-radius: 28px 10px 28px 10px; transform: rotate(2deg); box-shadow: 10px 12px 0 rgba(23,33,59,.16); overflow: hidden; }
    .mission-card::before { content: ""; position: absolute; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,212,92,.2); right: -60px; top: -65px; }
    .mission-card::after { content: "✦"; position: absolute; right: 24px; bottom: 12px; font-size: 4rem; color: rgba(255,255,255,.18); }
    .mission-card h2 { font-size: 1.55rem; margin-bottom: 22px; }
    .mission-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 15px; }
    .mission-list li { display: flex; align-items: flex-start; gap: 12px; line-height: 1.35; font-weight: 800; }
    .mission-list b { flex: 0 0 31px; height: 31px; display: grid; place-items: center; background: var(--yellow); color: var(--ink); border-radius: 50%; font-size: .85rem; }
    .rule-strip { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }
    .rule-chip { padding: 8px 12px; border-radius: 99px; background: #eef4ff; border: 1px solid #d6e4fd; color: var(--blue-dark); font-weight: 900; font-size: .8rem; }
    .quiz-header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 22px; }
    .quiz-header h2 { font-size: clamp(1.8rem, 4vw, 3.1rem); line-height: 1; letter-spacing: -.05em; margin-bottom: 0; }
    .score-box { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .stat { min-width: 90px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 13px; background: #fff; text-align: center; }
    .stat small { display: block; color: var(--ink-soft); font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 900; }
    .stat strong { display: block; font-size: 1.28rem; }
    .progress-track { height: 10px; border-radius: 99px; background: #e8edf5; overflow: hidden; margin-bottom: 28px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--mint)); border-radius: inherit; transition: width .35s ease; }
    .question-card { max-width: 850px; margin: 0 auto; }
    .question-label { color: var(--coral); font-weight: 900; text-transform: uppercase; letter-spacing: .13em; font-size: .76rem; margin-bottom: 15px; }
    .sentence { background: #fff; border: 2px dashed #b7c6df; border-radius: 22px; padding: clamp(24px, 5vw, 42px); font-size: clamp(1.6rem, 4vw, 3.2rem); line-height: 1.18; font-weight: 900; letter-spacing: -.04em; margin-bottom: 12px; box-shadow: 0 8px 0 rgba(45,117,217,.07); }
    .blank { display: inline-flex; min-width: 74px; justify-content: center; color: var(--blue); border-bottom: 5px solid var(--yellow); padding: 0 9px 3px; }
    .question-tip { color: var(--ink-soft); font-size: .9rem; margin-bottom: 22px; font-weight: 700; }
    .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .answer { cursor: pointer; border: 2px solid var(--line); background: #fff; color: var(--ink); padding: 16px 10px; border-radius: 15px; font-weight: 900; font-size: 1.2rem; min-height: 58px; transition: all .18s ease; }
    .answer:hover:not(:disabled) { border-color: var(--blue); color: var(--blue-dark); transform: translateY(-3px); box-shadow: 0 5px 0 rgba(45,117,217,.12); }
    .answer:disabled { cursor: default; }
    .answer.chosen { border-color: var(--blue); background: #eaf2ff; color: var(--blue-dark); }
    .answer.correct { border-color: var(--good); background: #e2f7ee; color: var(--good); }
    .answer.wrong { border-color: var(--bad); background: #fff0ed; color: var(--bad); }
    .answer.no-crase { font-size: .94rem; }
    .feedback { margin-top: 20px; border-radius: 18px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 15px; align-items: center; animation: rise .25s ease both; }
    .feedback.good { background: #e2f7ee; border: 2px solid #a8e4cb; }
    .feedback.bad { background: #fff0ed; border: 2px solid #f4b4a8; }
    .feedback h3 { margin: 0 0 5px; font-size: 1.16rem; }
    .feedback p { margin: 0; line-height: 1.45; color: #40516f; font-size: .95rem; }
    .feedback strong { color: var(--ink); }
    .feedback .button { white-space: nowrap; }
    .result-layout { max-width: 820px; margin: 0 auto; text-align: center; }
    .result-badge { width: 100px; height: 100px; display: grid; place-items: center; background: var(--yellow); border: 4px solid var(--ink); border-radius: 50%; box-shadow: 6px 6px 0 var(--ink); font-size: 2.6rem; margin: 4px auto 25px; animation: pop .5s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes pop { from { transform: scale(.2) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(7deg); opacity: 1; } }
    .result-layout h2 { font-size: clamp(2.4rem, 6vw, 4.8rem); letter-spacing: -.07em; margin-bottom: 10px; }
    .result-score { color: var(--blue); font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 900; margin-bottom: 10px; }
    .result-copy { color: var(--ink-soft); font-size: 1.05rem; line-height: 1.5; max-width: 580px; margin: 0 auto 25px; }
    .result-stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    .review { text-align: left; margin: 36px auto 0; border-top: 2px solid var(--line); padding-top: 24px; }
    .review h3 { margin-bottom: 15px; }
    .review-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .review-item { background: #fff; border: 1px solid var(--line); border-radius: 15px; padding: 15px; }
    .review-item b { display: block; color: var(--blue-dark); margin-bottom: 5px; }
    .review-item p { margin: 0; color: var(--ink-soft); font-size: .86rem; line-height: 1.4; }
    .rules-layout { max-width: 920px; margin: 0 auto; }
    .rules-layout h2 { font-size: clamp(2.2rem, 5vw, 4.5rem); letter-spacing: -.07em; margin-bottom: 10px; }
    .rules-intro { color: var(--ink-soft); line-height: 1.5; max-width: 650px; margin-bottom: 25px; }
    .rules-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 26px; }
    .rule-card { background: #fff; border: 2px solid var(--line); border-left: 8px solid var(--blue); border-radius: 16px; padding: 18px; }
    .rule-card:nth-child(2) { border-left-color: var(--coral); }
    .rule-card:nth-child(3) { border-left-color: var(--mint); }
    .rule-card:nth-child(4) { border-left-color: var(--lilac); }
    .rule-card h3 { margin-bottom: 8px; font-size: 1rem; }
    .rule-card p { margin: 0; color: var(--ink-soft); line-height: 1.45; font-size: .92rem; }
    .rule-card code { display: inline-block; margin-top: 10px; color: var(--ink); background: var(--cream); border-radius: 8px; padding: 5px 8px; font-weight: 900; font-family: inherit; }
    .footer-note { text-align: center; color: var(--ink-soft); margin-top: 22px; font-size: .78rem; font-weight: 700; }
    @media (max-width: 780px) {
      .app-shell { padding: 13px; }
      .topbar { margin-bottom: 13px; }
      .top-hint { display: none; }
      .main-card { border-radius: 24px; }
      .screen { min-height: calc(100vh - 80px); padding: 27px 20px; }
      .home-layout { grid-template-columns: 1fr; gap: 34px; }
      h1 { font-size: clamp(3.1rem, 17vw, 5rem); }
      .mission-card { transform: rotate(0); }
      .quiz-header { align-items: start; flex-direction: column; }
      .score-box { justify-content: flex-start; }
      .answers { grid-template-columns: repeat(2, 1fr); }
      .feedback { grid-template-columns: 1fr; }
      .feedback .button { width: 100%; }
      .review-grid, .rules-grid { grid-template-columns: 1fr; }
      .sentence { font-size: 1.65rem; }
    }
    @media (max-width: 420px) {
      .brand { font-size: 1rem; }
      .brand-mark { width: 37px; height: 37px; }
      .answers { gap: 8px; }
      .answer { padding: 13px 6px; font-size: 1.05rem; }
    }
  </style>

</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">à</span><span>Crase em Jogo</span></div>
      <div class="top-hint">Português brasileiro · funciona offline</div>
    </header>
    <main class="main-card" id="app" aria-live="polite"></main>
  </div>
  <script>
    (() => {
      const questions = [
        { sentence: 'Fui {blank} escola bem cedo.', answer: 'à', explanation: '“Ir” pede a preposição a e “escola” aceita o artigo a. A + a = à.', rule: 'Preposição a + artigo a', example: 'Fui à escola.' },
        { sentence: 'Entreguei o convite {blank} professora.', answer: 'à', explanation: 'Quem entrega, entrega algo a alguém. Como “professora” vem com artigo a, ocorre a fusão: à.', rule: 'Antes de palavra feminina determinada', example: 'Entreguei o convite à professora.' },
        { sentence: 'Cheguei {blank} uma conclusão importante.', answer: 'a', explanation: 'Antes do artigo indefinido “uma”, não usamos crase. É apenas a preposição a.', rule: 'Não há crase antes de artigo indefinido', example: 'Cheguei a uma conclusão.' },
        { sentence: 'Assisti {blank} filme ontem.', answer: 'ao', explanation: 'O verbo “assistir” (ver) pede a preposição a. Como “filme” é masculino e aceita o artigo o, temos a + o = ao.', rule: 'Preposição a + artigo o', example: 'Assisti ao filme.' },
        { sentence: 'Voltamos {blank} duas da tarde.', answer: 'às', explanation: 'Indicações de horas determinadas recebem crase: a + as duas horas = às duas.', rule: 'Antes de horas determinadas', example: 'A aula começa às 14h.' },
        { sentence: 'Ele se referiu {blank} regras do jogo.', answer: 'às', explanation: '“Referir-se” pede a preposição a e “regras” vem com o artigo as. A + as = às.', rule: 'Preposição a + artigo as', example: 'Referiu-se às regras.' },
        { sentence: 'A criança começou {blank} estudar.', answer: 'a', explanation: 'Não há crase antes de verbo. Aqui aparece somente a preposição a.', rule: 'Nunca há crase antes de verbo', example: 'Começou a estudar.' },
        { sentence: 'O livro foi entregue {blank} aluno.', answer: 'ao', explanation: '“Entregar” pede a preposição a e “aluno” aceita o artigo o. A + o = ao.', rule: 'Preposição a + artigo o', example: 'Entregue ao aluno.' },
        { sentence: 'Fiquei {blank} espera de notícias.', answer: 'à', explanation: '“À espera de” é uma locução prepositiva feminina que leva crase.', rule: 'Locução prepositiva feminina', example: 'Ficou à espera de notícias.' },
        { sentence: 'Li {blank} instruções antes de jogar.', answer: 'as', explanation: 'Aqui “as” é somente artigo definido plural, acompanhando “instruções”. Não existe preposição a para formar crase.', rule: 'Artigo as sem preposição', example: 'Li as instruções.' },
        { sentence: 'A reunião começa {blank} 8h.', answer: 'às', explanation: 'A indicação de hora determinada pede crase: às 8h.', rule: 'Horas determinadas', example: 'Chegue às 8h.' },
        { sentence: 'Ele prefere ir {blank} pé.', answer: 'a', explanation: 'Na expressão “a pé”, não há artigo feminino antes de “pé”; portanto, não ocorre crase.', rule: 'Expressão fixa sem artigo', example: 'Vou a pé.' }
      ];
      const options = ['à', 'a', 'ao', 'às', 'as', 'sem crase'];
      const rules = [
        ['A + A = À', 'A crase aparece quando a preposição a se encontra com o artigo feminino a.', 'Vou à biblioteca.'],
        ['A + AS = ÀS', 'No plural, a fusão da preposição com o artigo vira às.', 'Obedeço às regras.'],
        ['A + O = AO', 'Com palavras masculinas, a combinação equivalente é ao — sem acento grave.', 'Assisti ao filme.'],
        ['Sem crase', 'Não use crase antes de verbos, de “uma” ou quando existe apenas o artigo as.', 'Começou a estudar.']
      ];
      const app = document.querySelector('#app');
      const savedBest = Number(localStorage.getItem('crase-em-jogo-best') || 0);
      const state = { screen: 'home', index: 0, score: 0, streak: 0, correct: 0, selected: null, answered: false, best: savedBest };

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
      }
      function setScreen(screen) { state.screen = screen; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
      function startGame() { Object.assign(state, { screen: 'quiz', index: 0, score: 0, streak: 0, correct: 0, selected: null, answered: false }); render(); }
      function answer(value) {
        if (state.answered) return;
        const question = questions[state.index];
        const isCorrect = value === question.answer;
        state.selected = value;
        state.answered = true;
        if (isCorrect) { state.correct += 1; state.streak += 1; state.score += 100 + Math.max(0, (state.streak - 1) * 25); }
        else { state.streak = 0; }
        render();
      }
      function nextQuestion() {
        if (state.index === questions.length - 1) { state.best = Math.max(state.best, state.score); localStorage.setItem('crase-em-jogo-best', String(state.best)); setScreen('result'); return; }
        state.index += 1; state.selected = null; state.answered = false; render();
      }
      function displaySentence(question) { return escapeHtml(question.sentence).replace('{blank}', '<span class="blank">?</span>'); }
      function renderHome() {
        app.innerHTML = `<section class="screen home-layout">
          <div>
            <p class="eyebrow">Missão de português · 12 desafios</p>
            <h1>Domine a <span>crase.</span></h1>
            <p class="lead">Complete frases, descubra a regra e construa sua pontuação. Um desafio rápido para aprender jogando — ótimo para aula, revisão e apresentação.</p>
            <div class="cta-row"><button class="button primary" data-action="start">Começar desafio <span aria-hidden="true">→</span></button><button class="button secondary" data-action="rules">Revisar regras</button></div>
            <div class="rule-strip"><span class="rule-chip">à</span><span class="rule-chip">às</span><span class="rule-chip">ao</span><span class="rule-chip">a / as</span></div>
            <p class="footer-note" style="text-align:left">Melhor pontuação local: <strong>${state.best} pontos</strong></p>
          </div>
          <aside class="mission-card"><p class="eyebrow" style="color:#ffeaa0">Seu caderno de missão</p><h2>Você consegue identificar a escolha certa?</h2><ul class="mission-list"><li><b>1</b><span>Leia a frase com calma.</span></li><li><b>2</b><span>Escolha a forma que completa a lacuna.</span></li><li><b>3</b><span>Veja a explicação e aprenda a regra.</span></li></ul></aside>
        </section>`;
      }
      function renderRules() {
        app.innerHTML = `<section class="screen rules-layout"><p class="eyebrow">Mapa rápido</p><h2>Crase sem mistério.</h2><p class="rules-intro">Pense na crase como uma ponte: ela aparece quando a preposição <strong>a</strong> encontra um artigo feminino <strong>a</strong> ou <strong>as</strong>. Veja as pistas principais:</p><div class="rules-grid">${rules.map(([title, text, example]) => `<article class="rule-card"><h3>${title}</h3><p>${text}</p><code>${example}</code></article>`).join('')}</div><div class="cta-row"><button class="button primary" data-action="start">Praticar agora →</button><button class="button secondary" data-action="home">Voltar ao início</button></div></section>`;
      }
      function renderQuiz() {
        const q = questions[state.index];
        const progress = ((state.index + (state.answered ? 1 : 0)) / questions.length) * 100;
        const isCorrect = state.selected === q.answer;
        const optionButtons = options.map((option) => {
          let classes = 'answer' + (option === 'sem crase' ? ' no-crase' : '');
          if (state.answered && option === q.answer) classes += ' correct';
          if (state.answered && option === state.selected && option !== q.answer) classes += ' wrong';
          if (!state.answered && option === state.selected) classes += ' chosen';
          return `<button class="${classes}" data-answer="${escapeHtml(option)}" ${state.answered ? 'disabled' : ''}>${escapeHtml(option)}</button>`;
        }).join('');
        const feedback = state.answered ? `<div class="feedback ${isCorrect ? 'good' : 'bad'}"><div><h3>${isCorrect ? 'Acertou! Mandou bem.' : 'Quase! Vamos entender.'}</h3><p><strong>${escapeHtml(q.rule)}:</strong> ${escapeHtml(q.explanation)} <span>Exemplo: ${escapeHtml(q.example)}</span></p></div><button class="button ${isCorrect ? 'primary' : 'secondary'}" data-action="next">${state.index === questions.length - 1 ? 'Ver resultado' : 'Próxima →'}</button></div>` : '';
        app.innerHTML = `<section class="screen"><div class="quiz-header"><div><p class="eyebrow">Desafio ${state.index + 1} de ${questions.length}</p><h2>Complete a frase.</h2></div><div class="score-box"><div class="stat"><small>Pontos</small><strong>${state.score}</strong></div><div class="stat"><small>Sequência</small><strong>${state.streak}x</strong></div></div></div><div class="progress-track" aria-label="Progresso"><div class="progress-fill" style="width:${progress}%"></div></div><div class="question-card"><p class="question-label">Qual opção encaixa melhor?</p><div class="sentence" aria-label="Frase para completar">${displaySentence(q)}</div><p class="question-tip">Dica: observe o verbo e a palavra que vem depois da lacuna.</p><div class="answers">${optionButtons}</div>${feedback}</div></section>`;
      }
      function renderResult() {
        const percentage = Math.round((state.correct / questions.length) * 100);
        const message = percentage >= 90 ? 'Você está voando na crase!' : percentage >= 70 ? 'Muito bom! Sua regra está ficando afiada.' : percentage >= 50 ? 'Boa tentativa! A revisão vai ajudar bastante.' : 'Agora você já sabe por onde começar a estudar.';
        app.innerHTML = `<section class="screen result-layout"><div class="result-badge">${percentage >= 70 ? '★' : '✦'}</div><p class="eyebrow">Missão concluída</p><h2>${percentage}% de aproveitamento</h2><div class="result-score">${state.score} pontos</div><p class="result-copy">${message} Você acertou <strong>${state.correct} de ${questions.length}</strong> desafios. ${state.score === state.best ? '<strong>Essa é sua melhor marca!</strong>' : `Sua melhor marca é ${state.best} pontos.`}</p><div class="result-stats"><div class="stat"><small>Acertos</small><strong>${state.correct}/${questions.length}</strong></div><div class="stat"><small>Maior sequência</small><strong>${Math.max(state.streak, 0)}x</strong></div></div><div class="cta-row" style="justify-content:center"><button class="button primary" data-action="restart">Jogar novamente</button><button class="button secondary" data-action="rules">Revisar regras</button></div><div class="review"><h3>Leve estas pistas com você</h3><div class="review-grid">${rules.slice(0, 3).map(([title, text]) => `<div class="review-item"><b>${title}</b><p>${text}</p></div>`).join('')}</div></div></section>`;
      }
      function render() {
        if (state.screen === 'home') renderHome();
        if (state.screen === 'rules') renderRules();
        if (state.screen === 'quiz') renderQuiz();
        if (state.screen === 'result') renderResult();
      }
      app.addEventListener('click', (event) => {
        const target = event.target.closest('[data-action], [data-answer]');
        if (!target) return;
        if (target.dataset.answer) answer(target.dataset.answer);
        if (target.dataset.action === 'start' || target.dataset.action === 'restart') startGame();
        if (target.dataset.action === 'rules') setScreen('rules');
        if (target.dataset.action === 'home') setScreen('home');
        if (target.dataset.action === 'next') nextQuestion();
      });
      document.addEventListener('keydown', (event) => {
        if (state.screen !== 'quiz' || state.answered) return;
        const number = Number(event.key);
        if (number >= 1 && number <= options.length) answer(options[number - 1]);
      });
      render();
    })();
  </script>
</body>
</html>
